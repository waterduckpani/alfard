<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row { display:flex; align-items:center; gap: 36px; padding: 18px 6px 12px; }

.mark { width: 96px; height: 96px; flex:none; display:grid; place-items:center; }
.mark img { width: 100%; height: 100%; display:block; }

.wordmark { display:flex; flex-direction:column; gap: 6px; }
.wordmark .name {
  font: 700 36px/1 var(--font-display);
  letter-spacing: -0.025em;
  color: var(--ink-400);
}
.wordmark .tag {
  font: 400 14px/1.4 var(--font-body);
  color: var(--fg-2);
  max-width: 340px;
}

.notes {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 14px 14px;
  border-top: 1px solid var(--border);
  margin: 0 -4px;
}
.notes .lbl { font: var(--t-eyebrow); text-transform: uppercase; letter-spacing: 0.16em; color: var(--fg-3); }
.notes .v   { font: var(--t-small); color: var(--fg-1); margin-top: 4px; }
.notes .v code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-400); background: var(--paper-200); padding: 1px 5px; border-radius: 4px; }

/* Lockups */
.lockups { display:flex; gap: 18px; align-items:center; padding: 6px 4px; }
.lockup {
  display:flex; align-items:center; gap: 12px;
  padding: 14px 18px;
  border-radius: var(--r-3);
  border: 1px solid var(--border);
  background: var(--paper-50);
}
.lockup.inv { background: var(--ink-400); border-color: var(--ink-400); }
.lockup .mini { width: 32px; height: 32px; flex:none; }
.lockup .mini img { width:100%; height:100%; display:block; }
.lockup .nm { font: 700 20px/1 var(--font-display); letter-spacing: -0.02em; color: var(--ink-400); }
.lockup.inv .nm { color: var(--paper-50); }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="mark"><img src="alfard-mark-dark.svg" alt="Alfard"/></div>
    <div class="wordmark">
      <div class="name">Alfard</div>
      <div class="tag">A calmer way to run your agents.</div>
    </div>
  </div>

  <div class="lockups">
    <div class="lockup">
      <div class="mini"><img src="alfard-mark-dark.svg" alt=""/></div>
      <div class="nm">Alfard</div>
    </div>
    <div class="lockup inv">
      <div class="mini"><img src="alfard-mark-light.svg" alt=""/></div>
      <div class="nm">Alfard</div>
    </div>
  </div>

  <div class="notes">
    <div><div class="lbl">Mark</div><div class="v">Soft arrowed <code>A</code> with metallic gradient.</div></div>
    <div><div class="lbl">Light mode</div><div class="v"><code>alfard-mark-dark.svg</code> — darker fill for paper backgrounds.</div></div>
    <div><div class="lbl">Dark mode</div><div class="v"><code>alfard-mark-light.svg</code> — lighter fill for ink backgrounds.</div></div>
  </div>
</div>
</body></html>
