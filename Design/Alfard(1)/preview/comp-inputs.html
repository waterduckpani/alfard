<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.row { display:flex; gap:14px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
.row .lbl { width: 90px; font: var(--t-mono-sm); color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }

.input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  color: var(--ink-300);
  font: 400 14px/1 var(--font-body);
  padding: 11px 14px;
  width: 300px;
  outline: none;
  transition: border var(--dur-1), box-shadow var(--dur-1);
  box-shadow: var(--shadow-1);
}
.input::placeholder { color: var(--ink-50); }
.input.focused {
  border-color: var(--ink-400);
  box-shadow: 0 0 0 3px rgba(20,19,15,0.12);
}
.input.error {
  border-color: #B85C5C;
  box-shadow: 0 0 0 3px rgba(184,92,92,0.18);
}
.input-mono {
  font-family: var(--font-mono);
  font-size: 13px;
}

.with-prefix {
  display:flex; align-items:center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2);
  width: 340px; box-shadow: var(--shadow-1);
}
.with-prefix .px {
  padding: 0 12px; color: var(--ink-50);
  border-right: 1px solid var(--border);
  font: 400 13px/1 var(--font-mono);
}
.with-prefix input {
  background: transparent; border:0; outline:0; color: var(--ink-300);
  font: 400 14px/1 var(--font-body);
  padding: 11px 14px; flex:1;
}

.select {
  appearance: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  color: var(--ink-300);
  font: 400 14px/1 var(--font-body);
  padding: 11px 38px 11px 14px;
  width: 220px;
  box-shadow: var(--shadow-1);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23908A7E' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
}
.helper { font: var(--t-small); color: var(--fg-2); }
.helper.err { color: #8C3F3F; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Inputs · fields · select</div>

  <div class="row">
    <div class="lbl">Default</div>
    <input class="input" placeholder="Name this workflow…"/>
    <span class="helper">Used in the URL · /workflows/&lt;slug&gt;</span>
  </div>

  <div class="row">
    <div class="lbl">Focused</div>
    <input class="input focused" value="researcher-v3" />
  </div>

  <div class="row">
    <div class="lbl">With prefix</div>
    <div class="with-prefix">
      <span class="px">alfard.ai/</span>
      <input value="ops-team" />
    </div>
  </div>

  <div class="row">
    <div class="lbl">Mono</div>
    <input class="input input-mono" value="sk-alf-••••••••••••5dQ2"/>
    <span class="helper">API key · last rotated 4d ago</span>
  </div>

  <div class="row">
    <div class="lbl">Select</div>
    <select class="select">
      <option>claude-opus-4</option>
      <option>claude-sonnet-4</option>
      <option>gpt-5</option>
    </select>
    <span class="helper">Default model for new agents</span>
  </div>

  <div class="row">
    <div class="lbl">Error</div>
    <input class="input error" value="rate-limit"/>
    <span class="helper err">Name already in use</span>
  </div>
</div>
</body></html>
