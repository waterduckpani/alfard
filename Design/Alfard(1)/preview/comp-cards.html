<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.card-ui {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: var(--shadow-1);
}
.card-ui .head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.card-ui .title { font: 600 16px/1.2 var(--font-display); color: var(--ink-400); letter-spacing:-0.01em; }
.card-ui .meta { font: var(--t-mono-sm); color: var(--ink-50); }
.card-ui .desc { font: 400 14px/1.5 var(--font-body); color: var(--ink-100); }
.card-ui .foot { display:flex; align-items:center; gap:10px; font: var(--t-mono-sm); color: var(--ink-50); }
.card-ui .foot .sep { width:3px; height:3px; border-radius:50%; background: var(--paper-400); }

.pill {
  display:inline-flex; align-items:center; gap:6px;
  font: 540 11.5px/1 var(--font-display);
  padding: 4px 10px; border-radius: var(--r-pill);
  border:1px solid;
}
.p-live { background: #ECF0E2; color:#4A6B3F; border-color: #C9D5B4; }
.p-ok   { background: #ECF0E2; color:#4A6B3F; border-color: #C9D5B4; }
.pill .d { width: 6px; height: 6px; border-radius: 50%; }
.pill .d.lv { background:#6B8E5A; animation: p 1.6s infinite; }
.pill .d.dn { background:#6B8E5A; }
@keyframes p { 0%,100% { opacity:1 } 50% { opacity:0.35 } }

.progress { height: 5px; border-radius: 3px; background: var(--paper-200); overflow: hidden; }
.progress > div { width: 64%; height: 100%; background: var(--ink-400); border-radius: 3px; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Cards · panel surface</div>
  <div class="grid">
    <div class="card-ui">
      <div class="head">
        <div class="title">researcher · ag_8f2</div>
        <span class="pill p-live"><span class="d lv"></span>streaming</span>
      </div>
      <div class="desc">Crawling 14 sources on Q3 competitor pricing. Found 8 references so far.</div>
      <div class="progress"><div></div></div>
      <div class="foot">
        <span>0:42</span><span class="sep"></span><span>4,221 tok</span><span class="sep"></span><span>$0.018</span>
      </div>
    </div>
    <div class="card-ui">
      <div class="head">
        <div class="title">outbound-emailer</div>
        <span class="pill p-ok"><span class="d dn"></span>complete</span>
      </div>
      <div class="desc">Sent 42 emails. 18 opened in the last hour. No retries needed.</div>
      <div class="foot">
        <span>3m ago</span><span class="sep"></span><span>v3.2.1</span><span class="sep"></span><span>trigger · cron</span>
      </div>
    </div>
  </div>
</div>
</body></html>
