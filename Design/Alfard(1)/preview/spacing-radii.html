<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.tok { display:flex; flex-direction:column; align-items:center; gap:8px; }
.tok .box {
  width: 78px; height: 60px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-1);
}
.tok .n { font: var(--t-label); color: var(--ink-300); }
.tok .h { font: 400 10.5px/1.2 var(--font-mono); color: var(--ink-50); text-align:center; }
.tok .box.dark { background: var(--ink-400); border-color: transparent; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Radii — soft & welcoming</div>
  <div class="grid">
    <div class="tok"><div class="box" style="border-radius:0"></div><div class="n">r-0</div><div class="h">0 · split</div></div>
    <div class="tok"><div class="box" style="border-radius:8px"></div><div class="n">r-1</div><div class="h">8 · chips</div></div>
    <div class="tok"><div class="box" style="border-radius:12px"></div><div class="n">r-2</div><div class="h">12 · buttons</div></div>
    <div class="tok"><div class="box" style="border-radius:16px"></div><div class="n">r-3</div><div class="h">16 · cards</div></div>
    <div class="tok"><div class="box" style="border-radius:22px"></div><div class="n">r-4</div><div class="h">22 · sheets</div></div>
    <div class="tok"><div class="box dark" style="border-radius:999px; width:60px"></div><div class="n">r-pill</div><div class="h">∞ · status</div></div>
  </div>
  <div style="font: var(--t-small); color: var(--fg-2); padding-top: 4px;">
    Pills stay tight at <span class="mono" style="color:var(--ink-300)">999px</span> — they read as labels, not buttons. Everything else feels soft. No 24px+ blob cards.
  </div>
</div>
</body></html>
