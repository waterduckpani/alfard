<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.palette {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-4);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.search {
  display:flex; align-items:center; gap:12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}
.search svg { color: var(--ink-50); }
.search input {
  background: transparent; border:0; outline:0; flex:1;
  font: 400 15px/1 var(--font-body); color: var(--ink-300);
}
.search .esc { font: 540 11px/1 var(--font-display); color: var(--ink-100); padding: 4px 7px; background: var(--paper-100); border-radius: 6px; border:1px solid var(--border); }

.section { padding: 8px 0 12px; }
.section .h {
  font: var(--t-eyebrow); text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--ink-50); padding: 10px 18px 6px;
}
.item {
  display:flex; align-items:center; gap:14px;
  padding: 9px 18px;
  font: 400 14px/1.2 var(--font-body); color: var(--ink-300);
  border-radius: 0;
  margin: 0 8px;
}
.item.active {
  background: var(--paper-100);
  border-radius: 10px;
}
.item .icon { width:16px; height:16px; color: var(--ink-100); }
.item.active .icon { color: var(--ink-400); }
.item .meta { margin-left:auto; font: var(--t-mono-sm); color: var(--ink-50); }
.item .kbd { font: 540 11px/1 var(--font-display); padding: 3px 6px; border-radius: 5px; background: var(--surface); border:1px solid var(--border); color: var(--ink-200); }
</style></head>
<body>
<div class="card">
  <div class="row-label">Command palette · ⌘K</div>
  <div class="palette">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input value="re" placeholder="What do you want to do?" />
      <span class="esc">esc</span>
    </div>
    <div class="section">
      <div class="h">Actions</div>
      <div class="item active">
        <svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M5 3l8 5-8 5V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Re-run last agent
        <span class="meta">researcher · 2m ago</span>
        <span class="kbd">⌘ R</span>
      </div>
      <div class="item">
        <svg class="icon" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Review pending approvals
        <span class="meta">3 waiting</span>
      </div>
      <div class="item">
        <svg class="icon" viewBox="0 0 16 16" fill="none"><path d="M3 12V4l5 4 5-4v8" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Create new workflow
        <span class="kbd">⌘ N</span>
      </div>
    </div>
  </div>
</div>
</body></html>
