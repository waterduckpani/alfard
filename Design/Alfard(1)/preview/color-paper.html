<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.ramp { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.s { display:flex; flex-direction:column; gap:0; }
.s .c { aspect-ratio: 1/1.1; border-radius: var(--r-2); border:1px solid var(--border); }
.s .n { font: var(--t-label); color: var(--fg-1); margin-top: 8px; }
.s .h { font: 400 10.5px/1.2 var(--font-mono); color: var(--fg-3); text-transform:uppercase; }
.note { font: var(--t-small); color: var(--fg-2); padding-top: 4px; max-width: 600px; }
.note b { color: var(--fg); font-weight: 600; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Paper — warm off-whites & light grays</div>
  <div class="ramp">
    <div class="s"><div class="c" style="background:#FFFFFF"></div><div class="n">paper-0</div><div class="h">FFFFFF</div></div>
    <div class="s"><div class="c" style="background:#FBFAF7"></div><div class="n">paper-50 ★</div><div class="h">FBFAF7</div></div>
    <div class="s"><div class="c" style="background:#F6F4EF"></div><div class="n">paper-100</div><div class="h">F6F4EF</div></div>
    <div class="s"><div class="c" style="background:#EFECE5"></div><div class="n">paper-200</div><div class="h">EFECE5</div></div>
    <div class="s"><div class="c" style="background:#E5E1D7"></div><div class="n">paper-300</div><div class="h">E5E1D7</div></div>
    <div class="s"><div class="c" style="background:#D6D1C4"></div><div class="n">paper-400</div><div class="h">D6D1C4</div></div>
    <div class="s"><div class="c" style="background:#B8B2A1"></div><div class="n">paper-500</div><div class="h">B8B2A1</div></div>
  </div>
  <div class="note">
    Backgrounds, surfaces, borders. <b>paper-50</b> is the default page background — a warm white that reads as paper, not screen-glare.
  </div>
</div>
</body></html>
