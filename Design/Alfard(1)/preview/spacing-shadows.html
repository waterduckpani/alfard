<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 10px 6px 6px; }
.tok { display:flex; flex-direction:column; align-items:center; gap:12px; }
.tok .box {
  width: 120px; height: 76px;
  background: var(--surface);
  border-radius: var(--r-3);
}
.tok .n { font: var(--t-label); color: var(--ink-300); }
.tok .h { font: 400 10.5px/1.2 var(--font-mono); color: var(--ink-50); text-align:center; max-width:140px; }

.b1 { box-shadow: 0 1px 2px rgba(20,19,15,0.04), 0 1px 1px rgba(20,19,15,0.03); }
.b2 { box-shadow: 0 2px 6px rgba(20,19,15,0.05), 0 6px 18px -6px rgba(20,19,15,0.08); }
.b3 { box-shadow: 0 8px 24px -8px rgba(20,19,15,0.12), 0 2px 6px rgba(20,19,15,0.05); }
.b4 { box-shadow: 0 24px 60px -16px rgba(20,19,15,0.22), 0 4px 12px rgba(20,19,15,0.06); }
</style></head>
<body>
<div class="card">
  <div class="row-label">Elevation — soft, low-contrast</div>
  <div class="grid">
    <div class="tok"><div class="box b1"></div><div class="n">shadow-1</div><div class="h">resting cards</div></div>
    <div class="tok"><div class="box b2"></div><div class="n">shadow-2</div><div class="h">hover · dropdown</div></div>
    <div class="tok"><div class="box b3"></div><div class="n">shadow-3</div><div class="h">modal · sheet</div></div>
    <div class="tok"><div class="box b4"></div><div class="n">shadow-pop</div><div class="h">command palette</div></div>
  </div>
</div>
</body></html>
