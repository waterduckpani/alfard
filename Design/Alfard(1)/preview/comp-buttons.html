<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 6px 0; }
.btn {
  font: 540 13.5px/1 var(--font-display);
  letter-spacing: -0.005em;
  padding: 11px 16px;
  border-radius: var(--r-2);
  border: 1px solid transparent;
  display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer;
  transition: all var(--dur-1) var(--ease-out);
}
.btn .icon { width: 14px; height: 14px; display:block; }

.btn-primary {
  background: var(--ink-400);
  color: var(--paper-50);
  border-color: var(--ink-400);
  box-shadow: var(--shadow-1);
}
.btn-primary:hover { background: #000; }

.btn-secondary {
  background: var(--surface);
  color: var(--ink-300);
  border-color: var(--border);
  box-shadow: var(--shadow-1);
}
.btn-secondary:hover { background: var(--paper-100); border-color: var(--border-strong); }

.btn-ghost { background: transparent; color: var(--ink-200); }
.btn-ghost:hover { background: var(--paper-100); color: var(--ink-400); }

.btn-danger {
  background: #F4E1DE;
  color: #8C3F3F;
  border-color: #E0B7B0;
}
.btn-danger:hover { background: #ECC9C3; }

.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 10px; }
.btn-lg { padding: 13px 20px; font-size: 14.5px; border-radius: 14px; }

.btn-icon {
  padding: 0; width: 36px; height: 36px; justify-content:center;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--ink-200); border-radius: var(--r-2);
}
.btn-icon:hover { color: var(--ink-400); border-color: var(--border-strong); }

.lbl { font: var(--t-mono-sm); color: var(--fg-3); width: 80px; text-transform: uppercase; letter-spacing: 0.06em; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Buttons</div>

  <div class="btn-row">
    <div class="lbl">Primary</div>
    <button class="btn btn-primary">
      <svg class="icon" viewBox="0 0 14 14" fill="none"><path d="M4 3l7 4-7 4V3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      Run agent
    </button>
    <button class="btn btn-primary btn-sm">Approve</button>
    <button class="btn btn-primary btn-lg">Deploy workflow</button>
  </div>

  <div class="btn-row">
    <div class="lbl">Secondary</div>
    <button class="btn btn-secondary">
      <svg class="icon" viewBox="0 0 14 14" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.3"/></svg>
      New workflow
    </button>
    <button class="btn btn-secondary">Filters · 3</button>
  </div>

  <div class="btn-row">
    <div class="lbl">Ghost</div>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-ghost">View logs</button>
    <button class="btn btn-danger">Stop run</button>
    <button class="btn btn-icon" aria-label="more">
      <svg viewBox="0 0 14 14" fill="none"><circle cx="3" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="11" cy="7" r="1.2" fill="currentColor"/></svg>
    </button>
  </div>
</div>
</body></html>
