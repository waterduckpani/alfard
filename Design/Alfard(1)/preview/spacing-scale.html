<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.scale { display:flex; align-items: flex-end; gap: 14px; padding: 14px 4px 10px; }
.unit { display:flex; flex-direction:column; align-items:center; gap:8px; }
.bar  { background: var(--ink-400); border-radius: 3px; width: 30px; }
.lbl  { font: var(--t-label); color: var(--ink-200); }
.lblh { font: 400 10px/1.2 var(--font-mono); color: var(--ink-50); }
.demo {
  display:flex; flex-direction:column; gap: 14px;
  padding: 18px; border:1px solid var(--border); border-radius: var(--r-3);
  background: var(--surface);
}
.demo-row { display:flex; align-items:center; gap: 14px; }
.demo-row span { font: var(--t-mono-sm); color: var(--ink-50); width: 50px; }
.demo-row .b { height: 10px; background: var(--paper-300); border-radius: 4px; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Spacing scale — 4px base</div>
  <div class="scale">
    <div class="unit"><div class="bar" style="height:4px"></div><div class="lbl">s-1</div><div class="lblh">4</div></div>
    <div class="unit"><div class="bar" style="height:8px"></div><div class="lbl">s-2</div><div class="lblh">8</div></div>
    <div class="unit"><div class="bar" style="height:12px"></div><div class="lbl">s-3</div><div class="lblh">12</div></div>
    <div class="unit"><div class="bar" style="height:16px"></div><div class="lbl">s-4</div><div class="lblh">16</div></div>
    <div class="unit"><div class="bar" style="height:20px"></div><div class="lbl">s-5</div><div class="lblh">20</div></div>
    <div class="unit"><div class="bar" style="height:24px"></div><div class="lbl">s-6</div><div class="lblh">24</div></div>
    <div class="unit"><div class="bar" style="height:32px"></div><div class="lbl">s-7</div><div class="lblh">32</div></div>
    <div class="unit"><div class="bar" style="height:40px"></div><div class="lbl">s-8</div><div class="lblh">40</div></div>
    <div class="unit"><div class="bar" style="height:56px"></div><div class="lbl">s-9</div><div class="lblh">56</div></div>
    <div class="unit"><div class="bar" style="height:72px"></div><div class="lbl">s-10</div><div class="lblh">72</div></div>
  </div>
  <div class="demo">
    <div class="demo-row"><span>s-2</span><div class="b" style="width:8px"></div></div>
    <div class="demo-row"><span>s-4</span><div class="b" style="width:16px"></div></div>
    <div class="demo-row"><span>s-6</span><div class="b" style="width:24px"></div></div>
    <div class="demo-row"><span>s-8</span><div class="b" style="width:40px"></div></div>
  </div>
</div>
</body></html>
