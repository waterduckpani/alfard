<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="_base.css"/>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
.row-label { font: var(--t-eyebrow); text-transform:uppercase; letter-spacing:0.16em; color:var(--fg-3); }
.row { display:flex; align-items:center; gap:14px; padding: 4px 0; flex-wrap: wrap; }
.lbl { width: 90px; font: var(--t-mono-sm); color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
.icons { display:flex; flex-wrap:wrap; gap: 10px; flex:1; }
.icons .i {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  background: var(--surface);
  color: var(--ink-200);
  box-shadow: var(--shadow-1);
}
.icons .i.active { color: var(--paper-50); background: var(--ink-400); border-color: var(--ink-400); }
.note {
  font: 400 13px/1.5 var(--font-body); color: var(--ink-100);
  border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px;
}
.note code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-300); background: var(--paper-100); padding: 1px 6px; border-radius: 5px; }
</style></head>
<body>
<div class="card">
  <div class="row-label">Iconography — Lucide, 1.5px stroke</div>

  <div class="row">
    <div class="lbl">Navigation</div>
    <div class="icons">
      <div class="i" data-lucide="home"></div>
      <div class="i active" data-lucide="bot"></div>
      <div class="i" data-lucide="workflow"></div>
      <div class="i" data-lucide="inbox"></div>
      <div class="i" data-lucide="list-checks"></div>
      <div class="i" data-lucide="activity"></div>
      <div class="i" data-lucide="database"></div>
      <div class="i" data-lucide="key-round"></div>
      <div class="i" data-lucide="settings"></div>
    </div>
  </div>

  <div class="row">
    <div class="lbl">Agent</div>
    <div class="icons">
      <div class="i" data-lucide="play"></div>
      <div class="i" data-lucide="square"></div>
      <div class="i" data-lucide="rotate-cw"></div>
      <div class="i" data-lucide="git-branch"></div>
      <div class="i" data-lucide="terminal"></div>
      <div class="i" data-lucide="search"></div>
      <div class="i" data-lucide="globe"></div>
      <div class="i" data-lucide="file-text"></div>
      <div class="i" data-lucide="paperclip"></div>
    </div>
  </div>

  <div class="row">
    <div class="lbl">Status</div>
    <div class="icons">
      <div class="i" data-lucide="check-circle-2" style="color:#4A6B3F; border-color:#C9D5B4; background:#ECF0E2"></div>
      <div class="i" data-lucide="alert-triangle" style="color:#8A6A22; border-color:#E5D29B; background:#F6EED8"></div>
      <div class="i" data-lucide="x-circle" style="color:#8C3F3F; border-color:#E0B7B0; background:#F4E1DE"></div>
      <div class="i" data-lucide="loader-2"></div>
      <div class="i" data-lucide="pause"></div>
      <div class="i" data-lucide="clock"></div>
    </div>
  </div>

  <div class="note">
    <span>Lucide via CDN · stroke 1.5 · default 16px · inherits <code>currentColor</code>. Single-tone. Saturated tinting only on status icons (sage / amber / terracotta), never on nav.</span>
  </div>
</div>
<script>
  lucide.createIcons({attrs: { width: 16, height: 16, "stroke-width": 1.5 } });
</script>
</body></html>
