[project]
name = "alfard"
version = "0.1.11"
description = "Local AI agent runtime — secure by default, private by design."
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "anthropic",
    "openai",
    "python-dotenv",
    "gitpython",
    "pyyaml",
    "mcp",
    "rich",
    "fastapi",
    "uvicorn",
    "click",
    "apscheduler>=3.10",
    "sqlalchemy",
    "slack-sdk",
    "numpy>=2.0",
    "questionary",
    "art",
    "ddgs",
    "cryptography>=42.0.0",
    "keyring>=25.0.0",
    "python-telegram-bot>=20.0",
    "discord.py>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/waterduckpani/alfard"
Repository = "https://github.com/waterduckpani/alfard"
Documentation = "https://docs.alfard.dev"

[project.scripts]
alfard = "alfard.cli.main:cli"
alfard-setup = "setup_alfard:run_setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfard"]

[tool.hatch.build.targets.wheel.force-include]
"setup_alfard.py" = "setup_alfard.py"