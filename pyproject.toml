[project]
name = "alfard"
version = "0.1.0"
description = "Secure-by-default local AI agent orchestration framework"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "python-dotenv",
    "gitpython",
    "pyyaml",
    "mcp",
    "rich",
    "fastapi",
    "uvicorn",
    "click",
    "apscheduler>=3.10",
    "slack-sdk",
    "numpy>=1.24",
]

[project.scripts]
alfard = "alfard.cli.main:cli"
alfard-setup = "setup_alfard:run_setup"


[tool.setuptools.packages.find]
include = ["alfard*"]