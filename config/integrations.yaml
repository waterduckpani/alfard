servers:
- name: notion
  transport: stdio
  command: npx
  args:
  - -y
  - '@notionhq/notion-mcp-server'
  env_vars:
    NOTION_TOKEN: NOTION_TOKEN
  tools:
    reversible:
    - notion_search
    - notion_get_page
    - notion_get_database
    - notion_query_database
    - notion_get_block_children
    irreversible:
    - notion_create_page
    - notion_update_page
    - notion_create_database
    - notion_update_database
    - notion_delete_block
    - notion_append_block_children
