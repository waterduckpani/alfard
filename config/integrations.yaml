servers:
- name: notion
  transport: stdio
  command: npx
  args:
  - -y
  - '@notionhq/notion-mcp-server'
  env_vars:
    NOTION_TOKEN: NOTION_TOKEN
  tools:
    reversible:
    - API-post-search
    - API-get-block-children
    - API-get-user
    - API-get-users
    - API-get-self
    - API-retrieve-a-page
    - API-retrieve-a-page-property
    - API-retrieve-a-block
    - API-retrieve-a-database
    - API-retrieve-a-data-source
    - API-query-data-source
    - API-list-data-source-templates
    - API-retrieve-a-comment
    irreversible:
    - API-post-page
    - API-patch-page
    - API-post-database
    - API-patch-database
    - API-delete-block
    - API-patch-block-children
    - API-append-block-children
- name: github
  transport: stdio
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-github'
  env_vars:
    GITHUB_PERSONAL_ACCESS_TOKEN: GITHUB_TOKEN
  tools:
    reversible:
    - get_repo
    - list_repos
    - get_issue
    - list_issues
    - get_pull_request
    - list_pull_requests
    - get_file_contents
    - search_repositories
    - search_code
    - list_commits
    irreversible:
    - create_issue
    - update_issue
    - create_pull_request
    - merge_pull_request
    - push_files
    - create_repository
    - delete_file
    - create_branch
